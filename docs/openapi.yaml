  /api/v1/consumption/advanced:
    get: { tags: [Consumption], summary: Consultar serie avanzada, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/alerts/home/{homeId}/pending:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
