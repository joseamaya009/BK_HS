    put: { tags: [Vacation], summary: Guardar modo vacaciones, responses: { default: { $ref: '#/components/responses/Default' } } }
    delete: { tags: [Vacation], summary: Eliminar modo vacaciones, responses: { default: { $ref: '#/components/responses/Default' } } }

