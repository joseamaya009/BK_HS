  /api/v1/recommendations/home/{homeId}/summary:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Recommendations], summary: Consultar resumen de recomendaciones, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/recommendations/{userRecommendationId}:
    parameters: [{ name: userRecommendationId, in: path, required: true, schema: { type: string } }]
