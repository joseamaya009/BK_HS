    post: { tags: [Roles], summary: Asignar rol al usuario, responses: { default: { $ref: '#/components/responses/Default' } } }
    delete: { tags: [Roles], summary: Retirar rol del usuario, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/support/catalogs:
    get: { tags: [Support], summary: Consultar catálogos de soporte, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/support/tickets:
