  /api/v1/devices/{deviceId}/telemetry/latest:
    parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Devices], summary: Consultar telemetría más reciente, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/devices/{deviceId}/config:
    parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
