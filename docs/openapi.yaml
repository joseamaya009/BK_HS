  /api/v1/consumption/daily:
    get: { tags: [Consumption], summary: Consultar serie diaria, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/consumption/monthly:
    get: { tags: [Consumption], summary: Consultar serie mensual, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/consumption/hourly:
    get: { tags: [Consumption], summary: Consultar serie horaria, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/consumption/cost:
