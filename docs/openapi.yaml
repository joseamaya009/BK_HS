    post: { tags: [Support], summary: Responder ticket, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/audit/logs:
    get: { tags: [Audit], summary: Consultar auditoría paginada, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/privacy/export:
    get: { tags: [Privacy], summary: Exportar datos personales propios, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/privacy/consents:
    get: { tags: [Privacy], summary: Consultar consentimientos, responses: { default: { $ref: '#/components/responses/Default' } } }
    post: { tags: [Privacy], summary: Registrar consentimiento, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/privacy/requests:
