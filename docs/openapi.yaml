  /api/v1/alerts/{alertId}/status:
    parameters: [{ name: alertId, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Alerts], summary: Actualizar estado de alerta, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/alerts/home/{homeId}/rules:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Alerts], summary: Listar reglas de alertas, responses: { default: { $ref: '#/components/responses/Default' } } }
    post: { tags: [Alerts], summary: Crear regla de alerta, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/alerts/home/{homeId}/history:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Alerts], summary: Consultar historial de alertas, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/alerts/rules/{ruleId}:
    parameters: [{ name: ruleId, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Alerts], summary: Actualizar regla de alerta, responses: { default: { $ref: '#/components/responses/Default' } } }
    delete: { tags: [Alerts], summary: Eliminar regla de alerta, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/alerts/home/{homeId}/thresholds:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Alerts], summary: Consultar umbrales del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
    put: { tags: [Alerts], summary: Guardar umbrales del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
    delete: { tags: [Alerts], summary: Eliminar umbrales del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/goals:
