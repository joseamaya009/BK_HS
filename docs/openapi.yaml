    post: { tags: [Devices], summary: Reclamar hardware físico, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/devices/{deviceId}/deactivate:
    parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
    post: { tags: [Devices], summary: Desactivar dispositivo, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/devices/{deviceId}/home/{homeId}:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string } }
      - { name: homeId, in: path, required: true, schema: { type: string } }
    delete: { tags: [Devices], summary: Desvincular dispositivo del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/consumption/budget-status:
    get: { tags: [Consumption], summary: Consultar estado de presupuesto, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/consumption/summary:
