openapi: 3.1.0
info:
  title: HidroSmart API
  version: 1.0.0
  description: |
    Catálogo de rutas y autenticación del backend montado en src/app.js.
    Este primer contrato documenta rutas y seguridad; los cuerpos, parámetros
    de consulta y esquemas de respuesta completos siguen definidos por rutas,
    controladores, DTO y pruebas. Actualizar este archivo cuando cambie alguno.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
security:
  - accessCookie: []
  - bearerAuth: []
x-csrf-protection:
  applies-when: Una petición mutante usa cookies de sesión de acceso o refresh.
  header: X-CSRF-Token
  cookie: hidrosmart_csrf
  bootstrap: GET /api/v1/auth/csrf entrega la cookie y expone el token en el header X-CSRF-Token.
  invalid-response: HTTP 403 con error.code CSRF_INVALID; el cliente puede renovar el token y reintentar una vez.
  note: El nombre del header y de las cookies es configurable; con Bearer sin cookie de sesión no se exige CSRF.
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Users }
  - { name: Homes }
  - { name: Devices }
  - { name: Consumption }
  - { name: Alerts }
  - { name: Goals }
  - { name: Vacation }
  - { name: Roles }
  - { name: Support }
  - { name: Audit }
  - { name: Privacy }
  - { name: Reports }
  - { name: Recommendations }
  - { name: Actuators }
  - { name: Tariffs }
paths:
  /:
    get: { tags: [Health], summary: Información básica de la API, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /health:
    get: { tags: [Health], summary: Estado general del servicio, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /health/live:
    get: { tags: [Health], summary: Liveness del proceso, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /health/ready:
    get: { tags: [Health], summary: Readiness de dependencias, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }

  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: Obtener cookie y token CSRF para llamadas mutables
      security: []
      responses:
        '204':
          description: Token emitido sin cuerpo; no se debe almacenar en caché
          headers:
            X-CSRF-Token:
              description: Token que el cliente envía en llamadas mutables
              schema: { type: string }
  /api/v1/auth/register:
    post: { tags: [Auth], summary: Registrar cuenta, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /api/v1/auth/login:
    post: { tags: [Auth], summary: Iniciar sesión y establecer cookies, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /api/v1/auth/refresh:
    post: { tags: [Auth], summary: Renovar sesión, responses: { default: { $ref: '#/components/responses/Default' } }, security: [{ refreshCookie: [] }] }
  /api/v1/auth/logout:
    post: { tags: [Auth], summary: Cerrar sesión y revocar refresh, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/auth/sessions:
    get: { tags: [Auth], summary: Listar sesiones propias, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/auth/sessions/{sessionId}:
    parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
    delete: { tags: [Auth], summary: Revocar sesión propia, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/auth/sessions/revoke-others:
    post: { tags: [Auth], summary: Revocar otras sesiones, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/auth/sessions/revoke-all:
    post: { tags: [Auth], summary: Revocar todas las sesiones, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/auth/change-password:
    post: { tags: [Auth], summary: Cambiar contraseña autenticado, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/auth/request-password-reset:
    post: { tags: [Auth], summary: Solicitar recuperación de contraseña, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /api/v1/auth/password-reset-context:
    get: { tags: [Auth], summary: Consultar contexto del token de recuperación, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /api/v1/auth/resend-verification:
    post: { tags: [Auth], summary: Reenviar verificación de correo, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /api/v1/auth/verify-email:
    post: { tags: [Auth], summary: Verificar correo, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }
  /api/v1/auth/reset-password:
    post: { tags: [Auth], summary: Restablecer contraseña con token, responses: { default: { $ref: '#/components/responses/Default' } }, security: [] }

  /api/v1/users:
    get: { tags: [Users], summary: Listar usuarios administrables, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/users/me:
    get: { tags: [Users], summary: Consultar perfil y permisos propios, responses: { default: { $ref: '#/components/responses/Default' } } }
    put: { tags: [Users], summary: Actualizar perfil propio, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/users/me/preferences:
    get: { tags: [Users], summary: Consultar preferencias propias, responses: { default: { $ref: '#/components/responses/Default' } } }
    put: { tags: [Users], summary: Actualizar preferencias propias, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/users/me/notifications:
    get: { tags: [Users], summary: Consultar preferencias de notificación, responses: { default: { $ref: '#/components/responses/Default' } } }
    put: { tags: [Users], summary: Actualizar preferencias de notificación, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/users/{userId}/overview:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Users], summary: Consultar resumen administrativo del usuario, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/users/{userId}/status:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Users], summary: Cambiar estado de cuenta, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/users/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    delete: { tags: [Users], summary: Eliminar lógicamente una cuenta, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/homes:
    get: { tags: [Homes], summary: Listar hogares accesibles, responses: { default: { $ref: '#/components/responses/Default' } } }
    post: { tags: [Homes], summary: Crear hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/homes/{homeId}:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Homes], summary: Consultar hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
    put: { tags: [Homes], summary: Actualizar hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/homes/{homeId}/members:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Homes], summary: Listar miembros del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
    post: { tags: [Homes], summary: Agregar miembro al hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/homes/{homeId}/members/{memberUserId}/role:
    parameters:
      - { name: homeId, in: path, required: true, schema: { type: string } }
      - { name: memberUserId, in: path, required: true, schema: { type: string } }
    patch: { tags: [Homes], summary: Cambiar rol de miembro, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/homes/{homeId}/members/{memberUserId}:
    parameters:
      - { name: homeId, in: path, required: true, schema: { type: string } }
      - { name: memberUserId, in: path, required: true, schema: { type: string } }
    delete: { tags: [Homes], summary: Retirar miembro del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/homes/{homeId}/membership-requests:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Homes], summary: Listar solicitudes de membresía del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
    post: { tags: [Homes], summary: Solicitar membresía al hogar, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/homes/membership-requests/{requestId}:
    parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Homes], summary: Aprobar o rechazar solicitud de membresía, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/devices:
    get: { tags: [Devices], summary: Listar dispositivos accesibles, responses: { default: { $ref: '#/components/responses/Default' } } }
