    patch: { tags: [Privacy], summary: Actualizar solicitud ARCO, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/reports/history:
    get: { tags: [Reports], summary: Consultar historial de reportes, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/reports/{reportId}/download:
