  /api/v1/actuators/states:
    get: { tags: [Actuators], summary: Consultar estados de actuadores, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/actuators/commands:
    get: { tags: [Actuators], summary: Listar comandos de actuadores, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/actuators/{deviceId}/{actuator}/commands:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string } }
      - { name: actuator, in: path, required: true, schema: { type: string } }
    post: { tags: [Actuators], summary: Enviar comando de actuador, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/actuators/{deviceId}/status:
    parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Actuators], summary: Consultar estado de actuadores del dispositivo, responses: { default: { $ref: '#/components/responses/Default' } } }

  /api/v1/tariffs/home/{homeId}:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Tariffs], summary: Consultar tarifa vigente del hogar, responses: { default: { $ref: '#/components/responses/Default' } } }

components:
  responses:
    Default:
      description: Respuesta del endpoint; consultar controlador/DTO para los códigos y el esquema concretos.
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: hidrosmart_access
      description: Nombre configurable con AUTH_ACCESS_COOKIE_NAME.
    refreshCookie:
      type: apiKey
      in: cookie
