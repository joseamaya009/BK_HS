  /api/v1/support/tickets/{ticketId}:
    parameters: [{ name: ticketId, in: path, required: true, schema: { type: string } }]
    get: { tags: [Support], summary: Consultar ticket, responses: { default: { $ref: '#/components/responses/Default' } } }
    patch: { tags: [Support], summary: Gestionar estado del ticket, responses: { default: { $ref: '#/components/responses/Default' } } }
  /api/v1/support/tickets/{ticketId}/responses:
